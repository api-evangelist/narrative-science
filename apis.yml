name: Narrative Science
description: >-
  Narrative Science was a Chicago-based artificial-intelligence company known for
  its Quill natural-language-generation (NLG) platform, which automatically turned
  structured data into written narratives and data stories. It was surfaced as a
  portfolio company of Battery Ventures and Sapphire Ventures and added to the API
  Evangelist network as a stub for enrichment. As of this enrichment pass the company
  no longer operates independently: Salesforce acquired Narrative Science in December
  2021 and folded its technology into Tableau. The former corporate domain
  (www.narrativescience.com) now 301-redirects to Tableau's AI/augmented-analytics
  pages, and no developer, api, or docs subdomains resolve. There is no independent
  public API, developer portal, OpenAPI, or documentation surface remaining to
  enrich; this profile is retained as a historical/acquisition record.
